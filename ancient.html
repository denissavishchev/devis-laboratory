<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ancient · Devis Laboratory</title>
  <meta name="description" content="Ancient: a handmade Telecaster-style guitar from Devis Laboratory.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Open+Sans:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ece4d3;
      --card: #faf6ec;
      --band: #e7dcc4;
      --ink: #1b1a33;
      --muted: #8a6a46;
      --amber: #c8803a;
      --brown: #8a4a1c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--ink);
      font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
    }
    a { color: inherit; text-decoration: none; }
    .ghost {
      position: fixed; right: 3vw; top: -2vw; font: 30vw/1 "Pinyon Script", cursive;
      color: rgba(200,128,58,.12); pointer-events: none; user-select: none;
    }
    .label { position: fixed; left: 40px; top: 28px; font-size: .8rem; color: var(--muted); }

    .card {
      position: relative; width: min(1180px, 100%); background: var(--card);
      box-shadow: 0 40px 60px -20px rgba(110,80,40,.28); padding: 0 56px;
      display: grid; grid-template-rows: auto 1fr auto; min-height: 640px; overflow: hidden;
    }
    /* top bar */
    .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 38px 0 0; font-size: .64rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .top .l { display: flex; align-items: center; gap: 22px; }
    .top .r { display: flex; justify-content: flex-end; align-items: center; gap: 22px; }
    .top nav { display: flex; gap: 44px; }
    .top nav a { color: var(--muted); }
    .top nav a.on, .top .r a:hover, .top nav a:hover { color: var(--ink); }
    .burger { width: 14px; display: grid; gap: 3px; }
    .burger i { height: 2px; background: var(--ink); }
    .burger i:nth-child(2) { width: 70%; }
    .logo { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--card); display: grid; place-items: center; font: 1rem/1 "Pinyon Script", cursive; text-transform: none; }

    /* stage */
    .stage { position: relative; display: grid; place-items: center; margin: 0 -56px; }
    .band { position: absolute; left: 0; right: 0; top: 50%; height: 190px; transform: translateY(-50%); background: var(--band); }
    .band::after { /* half-circle behind headstock */
      content: ""; position: absolute; right: 9%; top: 0; width: 190px; height: 100%;
      background: var(--card); opacity: 0; }
    .halo { position: absolute; right: 10%; top: 50%; width: 170px; height: 170px; transform: translate(0,-50%); border-radius: 50%; background: var(--band); }
    .halo::before { content: ""; position: absolute; right: 85px; top: 0; width: 280px; height: 170px; background: var(--band); }
    .guitar {
      position: relative; width: min(86%, 980px); height: auto; z-index: 2;
      filter: drop-shadow(0 26px 22px rgba(70,40,10,.35)); transition: transform .5s;
    }
    .guitar:hover { transform: scale(1.015) rotate(-.4deg); }
    .name {
      position: absolute; z-index: 3; top: 15%; right: 17%;
      font: 5rem/1 "Pinyon Script", cursive; color: var(--ink);
    }
    .name sup { font: 700 .5rem "Open Sans"; vertical-align: top; margin-left: 2px; }
    .cap {
      position: absolute; z-index: 3; bottom: 17%; right: 20%; max-width: 230px;
      font-size: .62rem; font-weight: 700; letter-spacing: .05em; color: var(--brown); text-transform: uppercase;
    }
    .arrow { position: absolute; z-index: 3; top: 50%; transform: translateY(-50%); font-size: .64rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; background: none; border: 0; color: var(--ink); font-family: inherit; }
    .arrow:hover { color: var(--amber); }
    .prev { left: 56px; } .next { right: 56px; }

    /* bottom */
    .bot { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 0 34px; }
    .num { font-size: 4.2rem; font-weight: 300; color: var(--amber); line-height: 1; }
    .pages { display: flex; align-items: center; gap: 20px; font-size: .62rem; font-weight: 700; }
    .pages a { color: var(--ink); }
    .pages a.on { color: var(--muted); font-weight: 400; display: flex; align-items: center; gap: 12px; }
    .pages a.on::after { content: ""; width: 60px; height: 1px; background: var(--muted); }
    .share { justify-self: end; display: flex; align-items: center; gap: 12px; font-size: .62rem; color: var(--muted); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
    .daily { position: fixed; right: 40px; bottom: 28px; font-size: .8rem; color: var(--muted); }

    @media (max-width: 820px) {
      .card { padding: 0 20px; min-height: 560px; }
      .stage { margin: 0 -20px; }
      .top { grid-template-columns: auto 1fr; } .top nav { display: none; }
      .band { height: 120px; } .halo { display: none; }
      .name { font-size: 2.8rem; top: 20%; right: 8%; }
      .cap { right: 8%; bottom: 22%; font-size: .55rem; max-width: 160px; }
      .arrow { display: none; }
      .num { font-size: 2.6rem; }
      .pages { display: none; } .bot { grid-template-columns: 1fr 1fr; }
      .label, .daily { display: none; }
    }
  </style>
</head>
<body>
  <div class="ghost" aria-hidden="true">A</div>
  <div class="label">Devis Laboratory</div>

  <main class="card">
    <header class="top">
      <div class="l"><span class="burger"><i></i><i></i><i></i></span><a href="index.html" class="logo" aria-label="Devis Laboratory">D</a></div>
      <nav>
        <a href="ancient.html" class="on">Home</a>
        <a href="index.html#gear">Products</a>
        <a href="index.html#about">About</a>
        <a href="index.html#vst">How use</a>
      </nav>
      <div class="r"><a href="index.html#about">Contact us</a>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </div>
    </header>

    <section class="stage">
      <div class="band"></div>
      <div class="halo"></div>
      <button class="arrow prev" aria-label="Previous">Previous</button>
      <img class="guitar" src="guitars/black/cutout/body-horizontal.png" alt="Ancient handmade electric guitar" width="2400" height="881">
      <div class="name">Ancient<sup>®</sup></div>
      <div class="cap">Handmade from reclaimed wood.<br>Aged brass, one pickup, no compromise.</div>
      <button class="arrow next" aria-label="Next">Next</button>
    </section>

    <footer class="bot">
      <div class="num">01</div>
      <div class="pages"><a class="on" href="#">01</a><a href="#">02</a><a href="#">03</a><a href="#">04</a></div>
      <div class="share">Share
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg>
      </div>
    </footer>
  </main>
  <div class="daily">Daily</div>
</body>
</html>
