<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ember · Devis Laboratory</title>
  <meta name="description" content="Ember: a burnt-wood Telecaster-style guitar with copper details.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800&display=swap" rel="stylesheet">
  <style>
    :root { --black: #0d0d0d; --red: #e0603a; --cream: #e8d9a8; --teal: #6fb3a8; --gold: #d9b45a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--black); color: #fff; min-height: 100vh; display: grid; place-items: center; padding: 28px 16px;
      font-family: Montserrat, -apple-system, Helvetica, Arial, sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    .poster { position: relative; width: min(1180px, 100%); min-height: 640px; display: grid; grid-template-rows: auto 1fr auto; padding: 0 0 28px; }

    nav { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px 22px; font-size: .68rem; font-weight: 500; letter-spacing: .3em; text-transform: uppercase; }
    nav .links { display: flex; gap: 28px; flex-wrap: wrap; justify-content: flex-end; }
    nav a { color: #aaa; } nav a:hover, nav a.on { color: #fff; }
    nav .brand { color: var(--gold); font-weight: 800; }

    .stage { position: relative; display: grid; align-items: end; }
    .strips { display: flex; gap: 2.2%; align-items: stretch; height: 100%; min-height: 470px; }
    .strip { position: relative; flex: 1; display: flex; flex-direction: column; }
    .strip.w2 { flex: 1.25; }
    .letter {
      font-weight: 800; font-size: clamp(3.4rem, 11.5vw, 10rem); line-height: .85; text-align: center; letter-spacing: -.02em;
      height: clamp(3.2rem, 11vw, 9.2rem); overflow: hidden;
    }
    .bar { flex: 1; border-radius: 0 0 6px 6px; }
    /* the first/last strips carry cut-in rounded tops like the reference */
    .strip .bar { border-top-left-radius: 38px; border-top-right-radius: 38px; }
    .c1 .letter { color: var(--red); } .c1 .bar { background: var(--red); }
    .c2 .letter { color: var(--cream); } .c2 .bar { background: var(--cream); }
    .c3 .letter { color: var(--cream); } .c3 .bar { background: var(--cream); }
    .c4 .letter { color: var(--teal); } .c4 .bar { background: var(--teal); }
    .c5 .letter { color: var(--gold); } .c5 .bar { background: var(--gold); }

    .guitar {
      position: absolute; left: 50%; top: 58%; transform: translate(-50%,-50%) rotate(-3deg); width: 90%; height: auto; z-index: 2;
      filter: drop-shadow(0 22px 18px rgba(0,0,0,.65)); transition: transform .5s;
    }
    .guitar:hover { transform: translate(-50%,-50%) rotate(0deg) scale(1.02); }
    .ridge { position: absolute; left: 0; right: 0; top: 40%; width: 100%; height: 90px; z-index: 1; pointer-events: none; opacity: .8; }

    h2 { text-align: center; font-weight: 500; letter-spacing: .5em; font-size: clamp(1.1rem, 3.4vw, 2.6rem); text-transform: uppercase; margin-top: 18px; padding-left: .5em; }
    .meta { display: flex; justify-content: center; gap: 36px; margin-top: 14px; font-size: .68rem; letter-spacing: .24em; text-transform: uppercase; color: #aaa; flex-wrap: wrap; }
    .meta b { color: var(--gold); font-weight: 800; }
    .buy { display: inline-block; margin: 20px auto 0; padding: 14px 40px; border-radius: 999px; background: var(--red); color: #fff; font-weight: 800; letter-spacing: .2em; font-size: .78rem; transition: .2s; }
    .buy:hover { background: var(--gold); color: #000; }
    .foot { display: grid; justify-items: center; }

    @media (max-width: 820px) {
      .strips { min-height: 340px; gap: 1.5%; }
      .strip .bar { border-top-left-radius: 18px; border-top-right-radius: 18px; }
      .guitar { width: 130%; top: 58%; }
      nav { flex-direction: column; gap: 12px; } nav .links { justify-content: center; gap: 14px; letter-spacing: .15em; }
      h2 { letter-spacing: .3em; } .meta { gap: 16px; }
    }
  </style>
</head>
<body>
  <div class="poster">
    <nav>
      <a class="brand" href="index.html">Devis Lab</a>
      <div class="links">
        <a href="ancient.html">Ancient</a>
        <a href="blueUI.html">Ocean</a>
        <a href="brownUI.html" class="on">Ember</a>
        <a href="redUI.html">Crimson</a>
      </div>
    </nav>

    <div class="stage">
      <div class="strips" aria-hidden="true">
        <div class="strip c1"><div class="letter">E</div><div class="bar"></div></div>
        <div class="strip c2 w2"><div class="letter">M</div><div class="bar"></div></div>
        <div class="strip c3 w2"><div class="letter">B</div><div class="bar"></div></div>
        <div class="strip c4"><div class="letter">E</div><div class="bar"></div></div>
        <div class="strip c5"><div class="letter">R</div><div class="bar"></div></div>
      </div>
      <svg class="ridge" viewBox="0 0 1000 90" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 70 L60 55 L120 60 L200 25 L260 10 L330 30 L380 50 L420 70 L470 40 L540 28 L600 55 L680 38 L760 20 L840 40 L920 55 L1000 45" fill="none" stroke="#0d0d0d" stroke-width="2" vector-effect="non-scaling-stroke"/>
      </svg>
      <img class="guitar" src="guitars/cutout/brown-horizontal.png" alt="Ember burnt-wood electric guitar" width="2400" height="834">
      <span class="sr" style="position:absolute;left:-9999px">Ember</span>
    </div>

    <div class="foot">
      <h2>Handmade Guitar</h2>
      <div class="meta"><span>Burnt <b>pine</b></span><span>Maple <b>neck</b></span><span>Copper <b>details</b></span><span><b>$1,450</b></span></div>
      <a class="buy" href="#">Buy now</a>
    </div>
  </div>
</body>
</html>
